# ============================================================
# pyproject.toml
# ============================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geostack3d"
version = "0.1.0"
description = "A practical GIS data harmonization and 3D visualization pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Syed M. S. Raza", email = "shabahatnaqvi786@gmail.com" }
]

# ── Required libraries — EXACT versions pinned ──────────────
dependencies = [
    "geopandas==1.1.4",
    "rasterio==1.5.0",
    "pyproj==3.7.2",
    "shapely==2.1.2",
    "fiona==1.10.1",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "pyarrow==21.0.0",
    "pydantic==2.12.4",
    "loguru==0.7.3",
    "pyvista==0.48.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["geostack3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=geostack3d --cov-report=term-missing -v"